max_width = 80
newline_style = "Unix"
edition = "2024"

# cargo fmtによる一括整形は禁止する。
# ファイルはBOMなしUTF-8、LFで保存する。
# stable rustfmtで表現できない規則は手動で守る。
# useは標準・外部・ローカルの順に空行で区分する。
# 各useグループ内はアルファベット順にする。
# 処理ステップはブロックコメント、注釈はラインコメントにする。
# 15行を超える関数・ブロックには区切りごとにステップコメントを置く。
# 非公開関数を含め、型・関数・フィールド・enum variantを文書化する。
# 型・関数のdocコメントは先頭と終端にコメントだけの行を置く。
# 関数には引数があれば引数節を置き、戻り値節を必須にする。
# 20行を超える関数には概要節を置く。
# テスト関数には目的と「注記」の手順を記す。
# implは型定義の直後に置き、例外の分離理由をコメントに記す。
# 特殊なderiveは適用理由を記す。
# Rustファイルは規定のcopyrightとモジュールヘッダーで始める。
